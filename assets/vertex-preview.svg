<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#05070b" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a27" />
      <stop offset="100%" stop-color="#0f131c" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="180" r="160" fill="#10b981" opacity="0.07" filter="url(#glow)" />
  <circle cx="950" cy="340" r="220" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />

  <!-- Left Side: Product Branding & Narrative -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <rect width="260" height="32" rx="16" fill="#141d2c" stroke="#253248" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">QUANTITATIVE ALPHA ENGINE</text>

    <!-- Brand Headline -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">VERTEX</text>
    <text x="0" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Stock Intelligence for Nifty 100 Outperformers</text>

    <text x="0" y="180" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      <tspan x="0" dy="0">Predictive modeling over 63 trading-day forward horizons.</tspan>
      <tspan x="0" dy="24">Probability of outperformance, expected alpha, and factor attribution.</tspan>
    </text>

    <!-- Quick Stats Pills -->
    <g transform="translate(0, 245)">
      <!-- Stat 1 -->
      <rect width="130" height="74" rx="8" fill="#111724" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="32" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="700">250K+</text>
      <text x="16" y="54" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Daily Records</text>

      <!-- Stat 2 -->
      <g transform="translate(142, 0)">
        <rect width="130" height="74" rx="8" fill="#111724" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="32" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="700">40+</text>
        <text x="16" y="54" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Factor Dimensions</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(284, 0)">
        <rect width="130" height="74" rx="8" fill="#111724" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="32" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="700">63 Days</text>
        <text x="16" y="54" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Prediction Horizon</text>
      </g>
    </g>

    <!-- Footer live URL badge -->
    <g transform="translate(0, 360)">
      <text x="0" y="16" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500">vertex-engine.onrender.com ↗</text>
    </g>
  </g>

  <!-- Right Side: Interactive Prediction Card UI Mockup -->
  <g transform="translate(600, 75)">
    <!-- Container Card -->
    <rect width="520" height="480" rx="12" fill="url(#cardGrad)" stroke="#223049" stroke-width="1.5" filter="url(#glow)" />
    
    <!-- Window Header Bar -->
    <rect width="520" height="46" rx="12" fill="#172032" />
    <circle cx="24" cy="23" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="42" cy="23" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="23" r="5" fill="#10b981" opacity="0.8" />
    <text x="260" y="28" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" text-anchor="middle">vertex // prediction-console</text>

    <!-- Inside Card: Selected Stock Header -->
    <g transform="translate(32, 76)">
      <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">INFY</text>
      <text x="75" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Infosys Limited · Nifty 100</text>
      <rect x="360" y="4" width="95" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="407" y="20" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">OUTPERFORM</text>
    </g>

    <!-- Metrics Row -->
    <g transform="translate(32, 134)">
      <!-- Metric 1: Probability -->
      <rect width="215" height="110" rx="8" fill="#101726" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Outperformance Probability</text>
      <text x="16" y="66" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="32" font-weight="800">78.4%</text>
      <!-- Progress Bar -->
      <rect x="16" y="84" width="183" height="6" rx="3" fill="#1e293b" />
      <rect x="16" y="84" width="144" height="6" rx="3" fill="url(#emeraldGrad)" />

      <!-- Metric 2: Expected Alpha -->
      <g transform="translate(235, 0)">
        <rect width="220" height="110" rx="8" fill="#101726" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Expected Alpha vs Nifty</text>
        <text x="16" y="66" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="32" font-weight="800">+5.18%</text>
        <text x="16" y="92" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">Horizon: 63 Trading Days</text>
      </g>
    </g>

    <!-- Factor Attribution Drivers -->
    <g transform="translate(32, 270)">
      <text x="0" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Key Factor Drivers (Attribution)</text>
      
      <!-- Driver 1 -->
      <g transform="translate(0, 32)">
        <rect width="455" height="38" rx="6" fill="#101726" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Price Momentum (12M &amp; 3M)</text>
        <text x="435" y="24" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" text-anchor="end">+1.82 (Bullish)</text>
      </g>

      <!-- Driver 2 -->
      <g transform="translate(0, 78)">
        <rect width="455" height="38" rx="6" fill="#101726" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Trend Strength (ADX &amp; Moving Avg)</text>
        <text x="435" y="24" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" text-anchor="end">+1.45 (Bullish)</text>
      </g>

      <!-- Driver 3 -->
      <g transform="translate(0, 124)">
        <rect width="455" height="38" rx="6" fill="#101726" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Downside Volatility Risk</text>
        <text x="435" y="24" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" text-anchor="end">Low Risk</text>
      </g>
    </g>
  </g>
</svg>
